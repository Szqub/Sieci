name: Security and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test and audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r PanOS-Toolbox/backend/requirements.txt -r panorama_cleaner/requirements.txt bandit==1.9.4 pip-audit==2.10.1
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r PanOS-Toolbox/backend/requirements.txt --progress-spinner off
          pip-audit -r panorama_cleaner/requirements.txt --progress-spinner off
      - name: Run Bandit
        run: |
          bandit -q -r PanOS-Toolbox/backend/panos_toolbox panorama_cleaner/panorama_cleanup \
            Panorama_rules_checker.py Panorama_Rule_Finder panorama_group_checker_update \
            Panorama_group_checker_v2 legacy_panorama_http.py -ll \
            -x PanOS-Toolbox/backend/panos_toolbox/static
      - name: Run Python unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/PanOS-Toolbox/backend:${{ github.workspace }}/panorama_cleaner
        run: |
          python -m unittest discover -s PanOS-Toolbox/backend/tests -v
          python -m unittest discover -s panorama_cleaner/tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PanOS-Toolbox/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: PanOS-Toolbox/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run
      - name: Check TypeScript
        run: npm run check
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build

  portable-windows:
    name: Portable package on Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: PanOS-Toolbox/frontend/package-lock.json
      - name: Build and smoke-test portable package
        shell: powershell
        run: .\PanOS-Toolbox\build_release.ps1 -SkipTests
